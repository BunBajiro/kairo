name: Kairo database implementation review
on:
  push:
    branches: ['perf/database-review-v0.7.3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kairo-database-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Probe v0.7.3 schema, history growth and query plans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ff8bbc530ce278a883f8b1831407095a14d3277d
          path: application
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
      - name: Run isolated database review
        run: node tests/performance/database-review.mjs application performance-results/database-review
      - name: Preserve query plans and measurement samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kairo-database-review-${{ github.sha }}
          path: performance-results/database-review/
          if-no-files-found: error
          retention-days: 30
