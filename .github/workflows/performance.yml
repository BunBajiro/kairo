name: Kairo internal performance

on:
  push:
    branches: ['perf/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairo-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Measure internal synthetic workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KAIRO_PERF_OUTPUT: performance-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked build dependencies
        run: npm run install:ci
      - name: Verify behavioural and measurement contracts
        run: |
          npm run test:kairo
          npm run test:perf
          npm run check:kairo
      - name: Compile the production frontend for internal measurements
        run: npm run build
      - name: Measure backend twice sequentially
        run: |
          KAIRO_PERF_OUTPUT=performance-results/run-1 npm run bench:backend
          KAIRO_PERF_OUTPUT=performance-results/run-2 npm run bench:backend
          node tests/performance/compare.mjs performance-results/run-1/backend.json performance-results/run-2/backend.json > performance-results/repeatability.md
      - name: Measure compiled frontend and stream renderer
        run: npm run bench:browser
      - name: Summarise measurements
        if: always()
        run: |
          for report in performance-results/run-1/backend.md performance-results/repeatability.md performance-results/browser.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Preserve internal reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kairo-internal-performance-${{ github.sha }}
          path: performance-results/
          if-no-files-found: error
          retention-days: 30
