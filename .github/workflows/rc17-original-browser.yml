name: Internal RC17 original-runtime browser replay

on:
  push:
    branches: ['perf/rc16-checkpoint-v0.8.0']
    paths: ['analysis/rc17/original-browser-request.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.ref == 'refs/heads/perf/rc16-checkpoint-v0.8.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: checkpoint
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 05d0d4b36c154329006d6772769063db874762da
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 11257683807
          run-id: 37078241973
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-artifact
          merge-multiple: true
      - name: Restore and verify exact original candidate runtime
        id: prepare
        working-directory: checkpoint
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, platform, shutil
          from pathlib import Path
          out=Path('analysis/rc17/raw/github');shutil.rmtree(out,ignore_errors=True);out.mkdir(parents=True)
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('analysis/rc17/harness').rglob('*') if p.is_file()}
          (out/'run-provenance.json').write_text(json.dumps({'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'harnessCommit':os.environ['GITHUB_SHA'],'baselineCommit':'57c8dcc7fbd8fc2b62129498d1819050c78381a1','historical073Commit':'239794774320fcdebaa1d76ce8a77c5c25cfc48c','candidateCommit':'05d0d4b36c154329006d6772769063db874762da','suite':'browser-original-artifact','originalRunId':37078241973,'platform':platform.platform(),'harnessSha256':hashes,'note':'Candidate-only correctness replay using exact original compiled assets. No build, dependency install, RC16 execution or performance remeasurement.'},indent=2)+'\n')
          PY
          python3 analysis/rc17/prepare-original-runtime.py "$GITHUB_WORKSPACE/original-artifact/internal-rc17-05d0d4b36c15.tar.gz" "$GITHUB_WORKSPACE/candidate" analysis/rc17/raw/github
          node analysis/rc17/harness/source-manifest.mjs capture "$GITHUB_WORKSPACE/candidate" analysis/rc17/raw/github/candidate-source.json 05d0d4b36c154329006d6772769063db874762da
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('analysis/rc17/raw/github');a=json.loads((root/'original-candidate-source.json').read_text());b=json.loads((root/'candidate-source.json').read_text())
          for key in ['sourceCommit','files','builtFiles','fingerprint']:assert a[key]==b[key],key
          PY
          mkdir -p analysis/rc17/raw/github/compiled-entrypoints/candidate
          cp "$GITHUB_WORKSPACE/candidate/dist/client/index.html" "$GITHUB_WORKSPACE/candidate/dist/client/index.rsc" analysis/rc17/raw/github/compiled-entrypoints/candidate/
      - name: Check original compiled Mapper preferences, geometry and cleanup
        id: browser
        working-directory: checkpoint
        env:
          KAIRO_CHROME_PATH: /usr/bin/google-chrome
          KAIRO_BROWSER_OUTPUT: analysis/rc17/raw/github/maps-browser
        run: KAIRO_BENCH_REPO="$GITHUB_WORKSPACE/candidate" flock /tmp/kairo-rc16-benchmark.lock node analysis/rc17/harness/maps-correctness.mjs
      - name: Verify original source and compiled assets after replay
        id: sources
        if: ${{ always() && !cancelled() && steps.prepare.outcome == 'success' }}
        working-directory: checkpoint
        run: node analysis/rc17/harness/source-manifest.mjs verify analysis/rc17/raw/github/candidate-source.json
      - name: Join exact-original browser gate with unchanged measurements
        id: combined
        if: ${{ always() && !cancelled() && steps.browser.outcome == 'success' && steps.sources.outcome == 'success' }}
        working-directory: checkpoint
        env:
          KAIRO_WORKFLOW_STEPS: ${{ toJSON(steps) }}
        run: python3 analysis/rc17/accept-original-browser.py analysis/rc17/raw/github-run-37078241973 analysis/rc17/raw/github
      - name: Assemble internal bundle with each original status retained
        id: bundle
        if: ${{ always() && !cancelled() && steps.sources.outcome == 'success' }}
        working-directory: checkpoint
        env:
          KAIRO_WORKFLOW_STEPS: ${{ toJSON(steps) }}
          KAIRO_REQUEST_SUITE: browser-original-artifact
        run: |
          python3 analysis/rc17/package-internal.py --checkpoint "$PWD" --candidate-manifest analysis/rc17/raw/github/candidate-source.json --baseline-manifest analysis/rc17/raw/github/rc16-source.json --output "$GITHUB_WORKSPACE/internal-rc17-bundle"
          python3 "$GITHUB_WORKSPACE/internal-rc17-bundle/internal-rc17/verify-bundle.py"
      - name: Retain exact-original browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-evidence
          path: checkpoint/analysis/rc17/raw/github/
          if-no-files-found: error
          retention-days: 30
      - name: Retain internal bundle manifest
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-bundle-manifest
          path: |
            internal-rc17-bundle/parts/parts.json
            internal-rc17-bundle/parts/reassemble-bundle.py
            internal-rc17-bundle/parts/README.md
            internal-rc17-bundle/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact-original internal bundle part 1
        if: ${{ always() && steps.bundle.outcome == 'success' && fromJSON(steps.bundle.outputs.parts) >= 1 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-bundle-part-01
          path: internal-rc17-bundle/parts/internal-rc17.part-01
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact-original internal bundle part 2
        if: ${{ always() && steps.bundle.outcome == 'success' && fromJSON(steps.bundle.outputs.parts) >= 2 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-bundle-part-02
          path: internal-rc17-bundle/parts/internal-rc17.part-02
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact-original internal bundle part 3
        if: ${{ always() && steps.bundle.outcome == 'success' && fromJSON(steps.bundle.outputs.parts) >= 3 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-bundle-part-03
          path: internal-rc17-bundle/parts/internal-rc17.part-03
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact-original internal bundle part 4
        if: ${{ always() && steps.bundle.outcome == 'success' && fromJSON(steps.bundle.outputs.parts) >= 4 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: internal-rc17-original-browser-bundle-part-04
          path: internal-rc17-bundle/parts/internal-rc17.part-04
          if-no-files-found: error
          retention-days: 30
